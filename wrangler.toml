# The dashboard Worker name must equal this `name` (Workers Builds requires it).
name = "lahtiag-site"

# With @astrojs/cloudflare 13+ the entrypoint is a package specifier; the
# adapter resolves it during `astro build`. Do not point this at dist/.
main = "@astrojs/cloudflare/entrypoints/server"

compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
# The @astrojs/cloudflare adapter rewrites this to "../client" (relative to
# the generated dist/server/wrangler.json) at build time, so this value is
# not what actually gets deployed via `astro build` + Workers Builds. It
# only matters if someone runs `wrangler deploy --config wrangler.toml`
# directly against the repo root; pointing it at dist/client keeps that path
# safe too, since dist/server (which includes entry.mjs) must never be
# uploaded as public static assets.
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
# src/lib/nav.ts's pagePath() emits extensionless links ("/about", no
# trailing slash) for every non-home page. The default asset handling
# (auto-trailing-slash) would redirect those to "/about/" before serving
# about/index.html, costing every nav click a round trip. This makes the
# server match the links it already generates instead of the other way
# around.
html_handling = "drop-trailing-slash"
# Cloudflare's asset router answers browser NAVIGATION requests (the ones
# carrying Sec-Fetch-Mode: navigate) for unmatched paths with the 404 page
# itself, never invoking the Worker — which 404'd every server route in real
# browsers while curl (no Sec-Fetch headers) sailed through. These routes
# must reach the Worker. Keep in sync with [env.preview.assets] below.
run_worker_first = [
  "/login",
  "/logout",
  "/auth/callback",
  "/events",
  "/events/*",
  "/announcements",
  "/announcements/*",
  "/discord/*",
]

# Production domain. The apex only: the user decided against a www redirect
# (www.lahtiag.fi previously pointed at the retired Google Sites page and is
# left unattached). Custom domains match exactly. The zone's MX/SPF records
# carry live Google Workspace mail and are unrelated to this route.
[[routes]]
pattern = "lahtiag.fi"
custom_domain = true

[observability]
enabled = true

# DISCORD_GUILD_ID is deliberately NOT here (src/lib/config.ts is its single
# home, baked in at build time, per the design spec). ADMIN_ROLE_ID is the
# spec's one plain var: the Board member role in the LahtiAG guild.
[vars]
ADMIN_ROLE_ID = "1299000982218211469,1210626196354895932"

[[d1_databases]]
binding = "DB"
database_name = "lahtiag"
database_id = "86177f14-544f-497c-b5a4-7802f463b37e"

# ---------------------------------------------------------------------------
# Preview environment. WRANGLER NAMED ENVIRONMENTS INHERIT NOTHING from the
# top level (Phase 1 review, trap 1): every table above must be repeated here
# or the preview deploy silently loses it. The preview Worker is named
# lahtiag-site-preview, serves on *.workers.dev (no custom domain), and binds
# a SEPARATE D1 database so previews cannot write real signups.
# Deploy with: npx wrangler deploy --env preview
# ---------------------------------------------------------------------------
[env.preview]
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[env.preview.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/login",
  "/logout",
  "/auth/callback",
  "/events",
  "/events/*",
  "/announcements",
  "/announcements/*",
  "/discord/*",
]

[env.preview.observability]
enabled = true

[env.preview.vars]
ADMIN_ROLE_ID = "1299000982218211469,1210626196354895932"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lahtiag-preview"
database_id = "115f5d46-a85b-4461-b6e4-ae98ea807984"
